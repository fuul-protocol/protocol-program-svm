name: 'Setup Anchor'
description: 'Install Anchor, Solana CLI tools, Node.js and Rust.'
inputs:
  node-version:
    description: 'Version of node.js to use'
    required: false
    default: '23.11.1'
  solana-cli-version:
    description: 'Version of Solana CLI to use'
    required: false
    default: '2.2.21' 
  anchor-version:
    description: 'Version of Anchor to use'
    required: false
    default: '0.32.1' 
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    # Without this the runner's bundled Yarn 1 runs instead, and since it cannot
    # read a Berry lockfile it resolves dependencies from scratch.
    - name: Enable Corepack
      run: corepack enable
      shell: bash

    - name: Cache Solana CLI tools
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/solana/
          ~/.local/share/solana/
        key: solana-cli-${{ runner.os }}-build-${{ inputs.solana-cli-version }}

    - name: Install Solana CLI tools
      run: |
        if [[ "${{ inputs.solana-cli-version }}" == 1* ]]; then
          cd $HOME
          wget -q https://github.com/solana-labs/solana/releases/download/v${{ inputs.solana-cli-version }}/solana-release-x86_64-unknown-linux-gnu.tar.bz2
          tar jxf solana-release-x86_64-unknown-linux-gnu.tar.bz2
          echo "$HOME/solana-release/bin" >> $GITHUB_PATH
        else
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ inputs.solana-cli-version }}/install)"
          echo "/home/runner/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
        fi
      shell: bash

    - name: Cache Rust toolchain & dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cargo/bin
          ~/.local/cargo/bin/anchor
          target
        key: rust-${{ runner.os }}-${{ inputs.anchor-version }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          rust-${{ runner.os }}-${{ inputs.anchor-version }}-


    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        profile: minimal
        override: true
    
    - name: Install system dependencies (for Anchor build)
      run: |
        sudo apt-get update
        sudo apt-get install -y libudev-dev pkg-config
      shell: bash

    - name: Install Anchor
      run: |
        if ! command -v anchor &> /dev/null || [[ "$(anchor --version)" != *"${{ inputs.anchor-version }}"* ]]; then
          cargo install --force --locked --git https://github.com/coral-xyz/anchor --tag v${{ inputs.anchor-version }} anchor-cli
        fi
        anchor --version
      shell: bash